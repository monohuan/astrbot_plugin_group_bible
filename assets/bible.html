<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=320">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:320px;min-height:140px;background:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#24262b}
.card{width:320px;min-height:140px;padding:10px;background:#fff}
.quote-card{width:300px;min-height:120px;padding:11px;background:#f3f4f6;border:1px solid #e0e2e6;border-radius:12px}
.name-row{min-height:24px;display:flex;align-items:baseline;flex-wrap:wrap;column-gap:7px;row-gap:2px;padding:0 2px 6px}
.badge{flex:0 0 auto;padding:2px 6px;color:#65758b;background:#e2e7ee;border-radius:5px;font-size:11px;font-weight:600;line-height:17px}
.name{max-width:100%;overflow-wrap:anywhere;color:#737780;font-size:15px;font-weight:600}
.time{color:#b0b2b8;font-size:11px;font-variant-numeric:tabular-nums}
.entry-id{color:#c0c2c7;font-size:10px}
.bubble{display:inline-block;width:auto;max-width:100%;padding:8px 11px 9px;background:#fff;border:1px solid #303238;border-radius:8px;overflow:hidden;vertical-align:top}
.bubble.image-only{display:block;width:100%;padding:4px}
.text{max-width:100%;color:#7586a2;font-size:17px;line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.images{display:grid;gap:4px;overflow:hidden;border-radius:5px}
.text+.images{margin-top:8px}
.images img{display:block;width:100%;height:100%;object-fit:cover;background:#f0f1f3;border-radius:4px}
.grid-1{grid-template-columns:1fr}.grid-1 img{height:auto;max-height:640px;object-fit:contain}
.grid-2,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3,.grid-5,.grid-6,.grid-7,.grid-8,.grid-9{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-2 img,.grid-3 img,.grid-4 img,.grid-5 img,.grid-6 img,.grid-7 img,.grid-8 img,.grid-9 img{aspect-ratio:1/1}
</style>
</head>
<body>
<main class="card">
  <article class="quote-card">
    <div class="name-row"><span class="badge">群圣经</span><span class="name">{{ author_name }}</span><span class="time">{{ timestamp }}</span>{% if entry_id %}<span class="entry-id">#{{ entry_id }}</span>{% endif %}</div>
    <div class="bubble{% if images %} image-only{% endif %}">
      {% if text %}<div class="text">{{ text }}</div>{% endif %}
      {% if images %}<div class="images grid-{{ image_count }}">{% for image in images %}<img src="{{ image }}">{% endfor %}</div>{% endif %}
    </div>
  </article>
</main>
</body>
</html>
